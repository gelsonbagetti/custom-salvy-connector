# GET /api/v2/virtual-phone-accounts — Listar números virtuais
#
# O endpoint não declara nenhum parâmetro de query na spec: não há paginação
# nem filtro incremental. Sync full a cada execução.
request:
  method: GET
  endpoint: "/virtual-phone-accounts"

response:
  # UNVERIFIED: a spec declara a resposta 200 como um array JSON na raiz, sem
  # envelope — daí o path vazio. Confirmar com:
  #   curl -s -H "Authorization: Bearer $SALVY_KEY" \
  #     https://api.salvy.com.br/api/v2/virtual-phone-accounts | head -c 200
  # Se a resposta começar com `{`, e não com `[`, ajustar para a chave do envelope.
  path: []
  primary_key: [id]

fields:
  - name: id
    type: string
  - name: name
    type: string
    nullable: true
  - name: phoneNumber
    type: string
  # pending | active | blocked | canceled
  - name: status
    type: string
  - name: createdAt
    type: timestamp
  - name: canceledAt
    type: timestamp
    nullable: true
  - name: cancelReason
    type: string
    nullable: true
  - name: redirectPhoneNumber
    type: string
    nullable: true
  - name: redirectExpiresAt
    type: timestamp
    nullable: true
  - name: costCenter
    type: string
    nullable: true
  - name: employeeId
    type: string
    nullable: true
  # Array de {label, type, value} — armazenado inteiro; a v2 não tem endpoint
  # de metadados que liste os campos personalizados, então não dá para usar
  # custom_field_endpoints/ aqui.
  - name: customFields
    type: json
