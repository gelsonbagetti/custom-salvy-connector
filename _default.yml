# Salvy — API v2 (https://docs.salvy.com.br/api-reference/v2/introduction)
#
# Transcrito da spec OpenAPI oficial: https://docs.salvy.com.br/api-reference/v2/openapi.json
# NÃO verificado contra respostas HTTP reais — ver os comentários "# UNVERIFIED:" nos
# arquivos de endpoint e a seção correspondente do resumo de entrega.
name: "Salvy"

authentication:
  # A chave é criada em https://app.salvy.com.br/settings/api e exibida apenas uma vez.
  # O ambiente (produção x sandbox) é determinado pelo prefixo da própria chave
  # (salvy_prod_ / salvy_test_) — a URL base é a mesma nos dois casos.
  - name: api_key
    type: secret
    required: true

request:
  # O prefixo /api/v2 fica nos paths dos endpoints, não aqui. Se a plataforma
  # juntar url_base + endpoint via urljoin, um endpoint iniciado por "/" volta
  # para a raiz do host e descartaria o /api/v2 — dando 404. Assim funciona
  # tanto com urljoin quanto com concatenação simples.
  url_base: "https://api.salvy.com.br"
  method: GET
  headers:
    Authorization: "Bearer <api_key>"
  # Os filtros de data da v2 (receivedAtFrom/receivedAtTo) esperam ISO8601.
  cursor_timestamp_format: "%Y-%m-%dT%H:%M:%SZ"

response:
  http_codes:
    401:
      message: "Token ausente, inválido ou expirado — verifique a chave de API da Salvy."
    403:
      message: "Chave de API sem permissão para este recurso."
    429:
      message: "Rate limit da API da Salvy — nova tentativa com backoff."
    500:
      message: "Erro interno da API da Salvy."
  # Nota: 404 NÃO é ignorado globalmente de propósito. Um 404 numa listagem
  # significa endpoint errado, e silenciá-lo produziria uma sync de zero linhas
  # sem erro. O 404 esperado (linha cancelada/removida) é tratado apenas em
  # sms_messages.yml, onde ele de fato acontece.

validation:
  # A v2 não expõe um /me. Este é o GET autenticado mais barato do conjunto:
  # devolve uma lista pequena e estática de DDDs e retorna 401 com chave inválida.
  endpoint: "/api/v2/virtual-phone-accounts/area-codes"
  request:
    method: GET
